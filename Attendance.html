---
layout: default
title: Attendance
---

<h1>Attendance Form</h1>

<form id="attendanceForm">
  <label>Full Name
    <input type="text" name="name" required />
  </label>

  <label>Department
    <select name="department" required>
      <option value="">Select</option>
      <option value="College">College</option>
      <option value="SHS">SHS</option>
    </select>
  </label>

  <label>Year Level
    <select name="year" required>
      <option value="">Select</option>
      <option>1st Year</option>
      <option>2nd Year</option>
      <option>3rd Year</option>
      <option>4th Year</option>
      <option>Grade 11</option>
      <option>Grade 12</option>
    </select>
  </label>

  <label>Section
    <input type="text" name="section" required />
  </label>

  <label>Attendance File Proof (PDF/IMG)
    <input type="file" name="file" accept=".pdf,image/*" required />
  </label>

  <button type="submit">Submit Attendance</button>
</form>

<div id="status"></div>

<script>
  const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  const API_KEY = 'YOUR_API_KEY';
  const SPREADSHEET_ID = 'YOUR_SPREADSHEET_ID';
  const SHEET_NAME = 'Sheet1';
  const DRIVE_FOLDER_ID = 'YOUR_DRIVE_FOLDER_ID';
  const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';

  let tokenClient;

  function showStatus(msg, isError = false) {
    const div = document.getElementById("status");
    div.textContent = msg;
    div.className = isError ? "error" : "success";
  }

  async function initClient() {
    await gapi.client.init({
      apiKey: API_KEY,
      discoveryDocs: [
        "https://sheets.googleapis.com/$discovery/rest?version=v4",
        "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
      ],
    });

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: () => {}
    });
  }

  function ensureAuth(callback) {
    tokenClient.callback = async (resp) => {
      if (resp.error) {
        showStatus("Authorization failed.", true);
        return;
      }
      callback();
    };
    if (!gapi.client.getToken()) {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } else {
      callback();
    }
  }

  async function uploadFile(file) {
    const metadata = {
      name: file.name,
      parents: [DRIVE_FOLDER_ID]
    };

    const formData = new FormData();
    formData.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    formData.append("file", file);

    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST",
      headers: new Headers({
        Authorization: "Bearer " + gapi.client.getToken().access_token
      }),
      body: formData
    });

    const data = await res.json();
    return `https://drive.google.com/file/d/${data.id}/view`;
  }

  async function addToSheet(values) {
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId: SPREADSHEET_ID,
      range: SHEET_NAME + "!A:E",
      valueInputOption: "USER_ENTERED",
      insertDataOption: "INSERT_ROWS",
      resource: {
        values: [values]
      }
    });
  }

  document.getElementById("attendanceForm").addEventListener("submit", (e) => {
    e.preventDefault();
    showStatus("Submitting...");

    ensureAuth(async () => {
      const form = e.target;
      const name = form.name.value;
      const department = form.department.value;
      const year = form.year.value;
      const section = form.section.value;
      const file = form.file.files[0];

      try {
        const fileUrl = await uploadFile(file);
        await addToSheet([name, department, year, section, fileUrl]);
        showStatus("Attendance submitted successfully!");
        form.reset();
      } catch (err) {
        console.error(err);
        showStatus("Submission failed. Check console.", true);
      }
    });
  });

  window.onload = () => {
    const script1 = document.createElement("script");
    script1.src = "https://apis.google.com/js/api.js";
    script1.onload = () => gapi.load("client", initClient);
    document.body.appendChild(script1);

    const script2 = document.createElement("script");
    script2.src = "https://accounts.google.com/gsi/client";
    document.body.appendChild(script2);
  };
</script>
