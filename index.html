<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>Attendance Form</h2>
        <form id="attendanceForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select Department</option>
                <option value="college">College</option>
                <option value="shs">Senior High School (SHS)</option>
            </select><br>

            <label for="program">Program:</label>
            <select id="program" name="program" required>
                <option value="" disabled selected>Select Program</option>
            </select><br>

            <label for="yearLevel">Year Level:</label>
            <select id="yearLevel" name="yearLevel" required>
                <option value="" disabled selected>Select Year Level</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select><br>

            <label for="section">Section:</label>
            <select id="section" name="section" required>
                <option value="" disabled selected>Select Section</option>
                <!-- Options will be added dynamically -->
            </select><br>

            <label for="proof">Proof of Attendance:</label>
            <input type="file" id="proof" name="proof" required><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        // Set up department selection event
        document.getElementById("department").addEventListener("change", function () {
            const department = this.value;
            const programSelect = document.getElementById("program");
            const sectionSelect = document.getElementById("section");

            // Clear previous options
            programSelect.innerHTML = '<option value="" disabled selected>Select Program</option>';
            sectionSelect.innerHTML = '<option value="" disabled selected>Select Section</option>';

            if (department === "college") {
                const programs = [
                    "Bachelor of Arts in English Language",
                    "Bachelor of Science in Accounting Information System",
                    "Bachelor of Science in Business Administration major in Financial Management",
                    "Bachelor of Science in Business Administration major in Human Resource Management",
                    "Bachelor of Science in Business Administration major in Marketing Management",
                    "Bachelor of Secondary Education major in Science",
                    "Bachelor of Secondary Education major in Filipino",
                    "Bachelor of Science in Biology",
                    "Bachelor in Human Services",
                    "Bachelor of Science in Medical Laboratory Science",
                    "Bachelor of Science in Nursing",
                    "Bachelor of Science in Pharmacy",
                    "Bachelor of Science in Physical Therapy",
                    "Bachelor of Science in Psychology",
                    "Bachelor of Science in Respiratory Therapy",
                    "Bachelor of Secondary Education major in English",
                    "Bachelor of Science in Radiologic Technology",
                    "Bachelor of Science in Biology major in Medical Biology"
                ];

                programs.forEach(program => {
                    const option = document.createElement("option");
                    option.value = program;
                    option.textContent = program;
                    programSelect.appendChild(option);
                });

                // Dynamically populate sections A to Z
                for (let i = 65; i < 91; i++) {
                    const sectionOption = document.createElement("option");
                    sectionOption.value = String.fromCharCode(i);
                    sectionOption.textContent = String.fromCharCode(i);
                    sectionSelect.appendChild(sectionOption);
                }
            } else if (department === "shs") {
                const programs = ["ABM", "STEM", "GAS", "HUMSS", "TVL"];
                programs.forEach(program => {
                    const option = document.createElement("option");
                    option.value = program;
                    option.textContent = program;
                    programSelect.appendChild(option);
                });

                // Dynamically populate sections A to Z
                for (let i = 65; i < 91; i++) {
                    const sectionOption = document.createElement("option");
                    sectionOption.value = String.fromCharCode(i);
                    sectionOption.textContent = String.fromCharCode(i);
                    sectionSelect.appendChild(sectionOption);
                }
            }
        });

        document.getElementById("attendanceForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const fileInput = document.getElementById("proof");
            const file = fileInput.files[0];

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64 = reader.result.split(",")[1];

                const formData = {
                    fullName: document.getElementById("fullName").value,
                    email: document.getElementById("email").value,
                    department: document.getElementById("department").value,
                    program: document.getElementById("program").value,
                    yearLevel: document.getElementById("yearLevel").value,
                    section: document.getElementById("section").value,
                    fileBase64: base64,
                    fileName: file.name,
                    fileType: file.type
                };

                const response = await fetch("https://script.google.com/macros/s/AKfycbyidFVzo-lOYYZ1lB9ZkapHONG6HzqvfQj2aym2Fs3WRcn_63sk9hoRm3U5Vlht-NvIBw/exec", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: new URLSearchParams(formData),
                });

                const result = await response.json();
                if (result.success) {
                    alert("Attendance submitted!");
                } else {
                    alert("Error: " + result.error);
                }
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>

</html>
