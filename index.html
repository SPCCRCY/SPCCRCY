<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Attendance Form</h1>
  <form id="attendance-form">
    <label>Full Name
      <input type="text" name="fullName" required />
    </label>

    <label>Department
      <select name="department" id="department" required>
        <option value="">-- Select Department --</option>
        <option value="College">College</option>
        <option value="SHS">SHS</option>
      </select>
    </label>

    <label>Program
      <select id="program" name="program" required>
        <option value="">-- Select Program --</option>
      </select>
    </label>

    <label>Year Level
      <select name="yearLevel" id="yearLevel" required>
        <option value="">-- Select Year Level --</option>
        <option value="11" class="shs">11</option>
        <option value="12" class="shs">12</option>
        <option value="1st Year" class="college">1st Year</option>
        <option value="2nd Year" class="college">2nd Year</option>
        <option value="3rd Year" class="college">3rd Year</option>
        <option value="4th Year" class="college">4th Year</option>
      </select>
    </label>

    <label>Section
      <select name="section" id="section" required>
        <option value="">-- Select Section --</option>
      </select>
    </label>

    <label>Attendance Proof (Screenshot/Image/PDF)
      <input type="file" name="proof" accept=".png, .jpg, .jpeg, .pdf" required />
    </label>

    <button type="submit">Submit Attendance</button>

    <div class="success" id="success-msg" style="display:none;">Attendance submitted successfully!</div>
    <div class="error" id="error-msg" style="display:none;">Submission failed. Please try again.</div>
  </form>

  <script>
    const departmentSelect = document.getElementById('department');
    const programSelect = document.getElementById('program');
    const yearLevelSelect = document.getElementById('yearLevel');
    const sectionSelect = document.getElementById('section');

    const collegePrograms = [
      "Bachelor of Arts in English Language",
      "Bachelor of Science in Accounting Information System",
      "Bachelor of Science in Business Administration major in Financial Management",
      "Bachelor of Science in Business Administration major in Human Resource Management",
      "Bachelor of Science in Business Administration major in Marketing Management",
      "Bachelor of Secondary Education major in Science",
      "Bachelor of Secondary Education major in Filipino",
      "Bachelor of Science in Biology",
      "Bachelor in Human Services",
      "Bachelor of Science in Medical Laboratory Science",
      "Bachelor of Science in Nursing",
      "Bachelor of Science in Pharmacy",
      "Bachelor of Science in Physical Therapy",
      "Bachelor of Science in Psychology",
      "Bachelor of Science in Respiratory Therapy",
      "Bachelor of Secondary Education major in English",
      "Bachelor of Science in Radiologic Technology",
      "Bachelor of Science in Biology major in Medical Biology"
    ];

    const shsStrands = ["ABM", "STEM", "GAS", "HUMSS", "TVL"];

    departmentSelect.addEventListener("change", () => {
      const selected = departmentSelect.value;

      // Populate programs
      programSelect.innerHTML = '<option value="">-- Select Program --</option>';
      const programs = selected === "College" ? collegePrograms :
                       selected === "SHS" ? shsStrands : [];

      programs.forEach(prog => {
        const opt = document.createElement("option");
        opt.value = prog;
        opt.textContent = prog;
        programSelect.appendChild(opt);
      });

      // Show/hide year levels
      Array.from(yearLevelSelect.options).forEach(option => {
        if (selected === "College") {
          option.style.display = option.classList.contains("college") || option.value === "" ? "block" : "none";
        } else if (selected === "SHS") {
          option.style.display = option.classList.contains("shs") || option.value === "" ? "block" : "none";
        } else {
          option.style.display = "none";
        }
      });

      // Reset year level selection
      yearLevelSelect.value = "";
    });

    // Populate sections A-Z
    const sectionOptions = '<option value="">-- Select Section --</option>' + 
      Array.from({length: 26}, (_, i) => {
        const letter = String.fromCharCode(65 + i); // A to Z
        return `<option value="${letter}">${letter}</option>`;
      }).join('');
    sectionSelect.innerHTML = sectionOptions;

    // Submit handler
    const form = document.getElementById("attendance-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        const response = await fetch("YOUR_API_ENDPOINT_HERE", {
          method: "POST",
          body: formData,
        });

        if (response.ok) {
          document.getElementById("success-msg").style.display = "block";
          document.getElementById("error-msg").style.display = "none";
          form.reset();
        } else {
          throw new Error("Submission failed");
        }
      } catch (error) {
        document.getElementById("success-msg").style.display = "none";
        document.getElementById("error-msg").style.display = "block";
        console.error(error);
      }
    });
  </script>
</body>
</html>
